<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lecture Test Runner</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0b0f14;
      --panel: #151b23;
      --panel-2: #0d1218;
      --border: #303946;
      --text: #f4f7fb;
      --muted: #9ba8b7;
      --accent: #70b7ff;
      --accent-text: #07111c;
      --danger: #ff7474;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .page { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }

    /* While a question is on screen, fill the viewport and centre the content
       vertically so there is no large empty band below the card. */
    #testCard:not(.hidden) {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: calc(100vh - 96px);
      min-height: calc(100dvh - 96px);
    }

    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    h2 { margin: 0 0 14px; font-size: 1.15rem; }
    p { margin: 0 0 16px; color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    select, input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      background: var(--panel-2);
      color: var(--text);
    }

    select:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    button {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
      background: var(--panel);
      color: var(--text);
      font: 700 1rem/1.2 inherit;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease, border-color 120ms ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--accent); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { cursor: not-allowed; opacity: 0.45; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
    }

    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
    .hidden { display: none !important; }

    .meta {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .progress-wrap {
      height: 8px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s ease; }

    .question {
      white-space: pre-wrap;
      font-size: 1.15rem;
      font-weight: 650;
      margin-bottom: 24px;
      /* Reserve a constant block so short/medium questions never shift the
         answers; a rare long question grows the block instead of clipping. */
      min-height: 10.5rem;
    }

    .answers { display: grid; gap: 12px; }

    .answer-btn {
      text-align: left;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      /* Fixed row height keeps every option letter in the same place each question. */
      height: 4.5rem;
      overflow-y: auto;
    }

    .answer-letter { font-weight: 800; color: var(--muted); min-width: 1.4em; }

    /* Larger type in the quiz view for at-a-distance readability. The fixed block
       heights grow to match so the options still never shift between questions. */
    body.testing .page { max-width: 1000px; }
    #testCard .meta { font-size: 1.05rem; }
    #testCard #questionNumber { font-size: 1.35rem; }
    #testCard .question {
      font-size: 1.55rem;
      line-height: 1.4;
      font-weight: 600;
      min-height: 9.5rem;
      margin-bottom: 18px;
    }
    #testCard .answers { gap: 10px; }
    #testCard .answer-btn {
      font-size: 1.2rem;
      line-height: 1.35;
      height: 5rem;
      padding: 12px 18px;
    }
    #testCard .answer-letter { font-size: 1.2rem; }

    .notice {
      margin-top: 18px;
      padding: 13px 15px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .error {
      margin-top: 14px;
      color: var(--danger);
      white-space: pre-wrap;
      font-size: 0.9rem;
      line-height: 1.45;
    }

    code {
      background: var(--panel-2);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 6px;
    }

    @media (max-width: 650px) {
      .grid { grid-template-columns: 1fr; }
      .card { padding: 20px; }
      .page { padding: 20px 14px 48px; }
      /* Narrower column wraps text onto more lines, so give the fixed blocks more room. */
      .question { min-height: 14rem; }
      .answer-btn { height: 6rem; }
      #testCard .question { font-size: 1.3rem; min-height: 13rem; }
      #testCard .answer-btn { font-size: 1.1rem; height: 6.5rem; }
      #testCard #questionNumber { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
<div class="page">

  <section id="setupCard" class="card">
    <h1>Knowledge Quiz Interface</h1>

    <div class="grid">
      <div>
        <label for="participantId">Participant ID</label>
        <input id="participantId" placeholder="e.g. 01" autocomplete="off" spellcheck="false" />
      </div>

      <div>
        <label for="lecture">Lecture</label>
        <select id="lecture">
          <option value="econ">Microeconomics</option>
          <!-- <option value="psych">Psychology</option> -->
        </select>
      </div>

      <div id="orderField">
        <label for="order">Variant</label>
        <select id="order">
          <option>123</option>
          <option>132</option>
          <option>213</option>
          <option>231</option>
          <option>312</option>
          <option>321</option>
        </select>
      </div>

      <div id="testField">
        <label for="test">Test</label>
        <select id="test">
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
        </select>
      </div>
    </div>

    <div class="row">
      <button class="primary" id="startBtn">Load and start test</button>
    </div>

    <div id="randomNotice" class="notice hidden">
      Random assignment is on: Variant and Test are picked at random for each
      participant when the test starts.
    </div>

    <div id="setupError" class="error"></div>
  </section>

  <section id="testCard" class="card hidden">
    <div id="testMeta" class="meta"></div>
    <div class="progress-wrap"><div id="progress" class="progress"></div></div>
    <h2 id="questionNumber"></h2>
    <div id="questionText" class="question"></div>
    <div id="answers" class="answers"></div>
  </section>

  <section id="completeCard" class="card hidden">
    <h1>Knowledge Quiz Complete!</h1>
    <p id="completeText">Your responses have been recorded.</p>

    <div class="row">
      <button class="primary" id="endTestBtn">End Quiz</button>
      <button id="restartBtn">Return</button>
    </div>
    
    <div id="completeError" class="error"></div>
  </section>

</div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// Result collection
// ---------------------------------------------------------------------------
// COLLECT_URL: the Google Apps Script web-app URL that receives results
//   (see COLLECTION_SETUP.md, step 3 — it looks like
//    https://script.google.com/macros/s/AKfy.../exec ).
//   Leave "" to disable upload and fall back to a local download.
// PUBLIC_KEY_SPKI_B64: your RSA public key, SPKI DER, base64, one line
//   (see COLLECTION_SETUP.md, step 1). Results are encrypted with this key
//   in the browser; only the matching private key can read them.
// COLLECT_TOKEN: optional shared string; if you set the same value in the
//   Apps Script, submissions without it are rejected. Not a real secret
//   (it ships in this file) — just cuts down on random noise.
const COLLECT_URL = "https://script.google.com/macros/s/AKfycbyagxydJSMpll8X7QCcmDFf6Up6xphp8UnStIZwitZHZAxyhMsnIPByX50vTNz1r9tf/exec";
const COLLECT_TOKEN = "idontevenwanttobehere";
const PUBLIC_KEY_SPKI_B64 =
  "MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAntIxY7HRQYEORy5VVg15svqJ3HJ5K7LgcJFww+yj2keVRbjY3TsksHvSGTsrdefZOTSiwP0ZdR6RzrR1DCDfQB2OFsobm9Siti8enp/WZqGah74XyvedhJGMaT6ZFgq6qO2HpSWwsbirSUDKJ3RDSSDv70s1ylfK7EErPB7jNV2ogv3oYHMkQHwsk1GLeIYzpoWlDbTM6pB3qtkZFxzZwW419Ubce9GdYK0ICd0o2n1vGfbixD0vWdoQBl+uPMXuXIRX8zDUB45TijtcTMOHftwPuxXz93qMx/K9/2ruslLwR+fcDeZtCO+qOR0z2I8cB6uO6if6n1MzdluPccA3CA7KC9WB9EzHwE6HCYpPGzDaj4Z1yeiL6LlY/q0yn0QepisUd4oA7xkcGdIZqg9jtSkEKkWZSms8dzv8MPySZxvdSH9UoCQ6P78XHSb16YT9KrPkYjosyeYl+WiilU2iBeag8jXuHahMUvWIVimlAUgzCQVT+Cr8Idl60U+Rmd2ZAgMBAAE=";

const IDK_TEXT = "I don't know";
const LETTERS = ["A", "B", "C", "D", "E"];
const ORDERS = ["123", "132", "213", "231", "312", "321"];
const TESTS = ["A", "B", "C"];

// Selection mode is loaded from config.json ("selectable" | "random").
//   selectable — the researcher picks Variant and Test from the dropdowns.
//   random     — the runner assigns a Variant and a Test at random when the
//                test starts (the dropdowns are hidden).
// Anything missing/unreadable/unrecognised falls back to "selectable".
let selectionMode = "selectable";

let questions = [];
let currentIndex = 0;
let outcomes = [];          // "correct" | "incorrect" | "idk", in question order
let questionRecords = [];  // per-question result metadata with timing and provenance
let questionStartAt = null;
let startedAt = null;
let configuration = null;
let testInProgress = false;

const $ = (id) => document.getElementById(id);

// ---- randomness helpers ----
function randInt(n) {
  const r = new Uint32Array(1);
  crypto.getRandomValues(r);
  return r[0] % n;
}

function randomPick(array) {
  return array[randInt(array.length)];
}

// ---- config ----
async function loadConfig() {
  try {
    const res = await fetch("config.json", { cache: "no-store" });
    if (res.ok) {
      const cfg = await res.json();
      if (cfg && (cfg.selection_mode === "random" || cfg.selection_mode === "selectable")) {
        selectionMode = cfg.selection_mode;
      }
    }
  } catch (_) {
    // No config file / not served / malformed — keep the default.
  }
  applySelectionMode();
}

function applySelectionMode() {
  const random = selectionMode === "random";
  $("orderField").classList.toggle("hidden", random);
  $("testField").classList.toggle("hidden", random);
  $("randomNotice").classList.toggle("hidden", !random);
}

// ---- answer shuffling ----
function shuffle(array) {
  const copy = [...array];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = randInt(i + 1);
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function randomizeAnswers(answerArray) {
  if (!Array.isArray(answerArray) || answerArray.length !== 5) {
    throw new Error("Each question must contain exactly 5 answers.");
  }
  const substantive = answerArray.filter((a) => a !== IDK_TEXT);
  if (substantive.length !== 4 || !answerArray.includes(IDK_TEXT)) {
    throw new Error("Expected four substantive answers plus \"I don't know\".");
  }
  return [...shuffle(substantive), IDK_TEXT];
}

function buildPath(lecture, order, test) {
  return "all.json";
}

function resolveQuestionSet(bundle, lecture, order, test) {
  if (bundle && bundle[lecture] && bundle[lecture][order] && bundle[lecture][order][test]) {
    return bundle[lecture][order][test];
  }

  const legacyPath = `${lecture}_${order}/${lecture}_test_${test}.json`;
  if (bundle && bundle.source_file === legacyPath) {
    return bundle;
  }

  return null;
}

function buildResultFile(meta, responses) {
  const summary = {
    total_questions: responses.length,
    correct: responses.filter((r) => r.outcome === "correct").length,
    incorrect: responses.filter((r) => r.outcome === "incorrect").length,
    idk: responses.filter((r) => r.outcome === "idk").length
  };

  return {
    format: "quiz-result",
    v: 1,
    meta,
    summary,
    responses
  };
}

// ---- load ----
async function loadTest() {
  $("setupError").textContent = "";

  const participantId = $("participantId").value.trim();
  const lecture = $("lecture").value;
  const order = selectionMode === "random" ? randomPick(ORDERS) : $("order").value;
  const test = selectionMode === "random" ? randomPick(TESTS) : $("test").value;

  if (!participantId) {
    $("setupError").textContent = "Enter a participant ID.";
    return;
  }

  const path = buildPath(lecture, order, test);

  try {
    const response = await fetch(path, { cache: "no-store" });
    if (!response.ok) {
      throw new Error(`Could not load ${path} (HTTP ${response.status}).`);
    }

    const bundle = await response.json();
    const testData = resolveQuestionSet(bundle, lecture, order, test);

    if (!testData || !Array.isArray(testData.questions) || testData.questions.length === 0) {
      throw new Error(`The bundle ${path} does not contain a valid ${lecture}/${order}/${test} question set.`);
    }

    configuration = {
      participant_id: participantId,
      lecture,
      assigned_order: Number(order),
      test,
      source_file: path,
      source_key: `${lecture}/${order}/${test}`,
      selection_mode: selectionMode
    };

    questions = testData.questions.map((q) => {
      if (!q.id || !q.q || !Array.isArray(q.a) || typeof q.k !== "string") {
        throw new Error("A question in the JSON has an unexpected structure.");
      }
      if (!q.a.includes(q.k)) {
        throw new Error(`${q.id}: correct-answer key does not match any option.`);
      }
      return {
        id: q.id,
        q: q.q,
        a: randomizeAnswers(q.a),
        k: q.k,
        source_variant: q.source_variant || null
      };
    });

    currentIndex = 0;
    outcomes = [];
    questionRecords = [];
    questionStartAt = Date.now();
    startedAt = new Date().toISOString();
    testInProgress = true;

    resetEndButton();
    document.body.classList.add("testing");
    $("setupCard").classList.add("hidden");
    $("completeCard").classList.add("hidden");
    $("testCard").classList.remove("hidden");
    renderQuestion();
  } catch (err) {
    $("setupError").textContent =
      err.message +
      "\n\nIf you opened this file by double-clicking it, serve the folder through a " +
      "local web server instead (e.g. `python -m http.server` in this folder).";
  }
}

function renderQuestion() {
  const q = questions[currentIndex];
  questionStartAt = Date.now();

  $("testMeta").textContent =
    `${configuration.participant_id}  ·  ${configuration.lecture}  ·  ` +
    `Test ${configuration.test}  ·  Order ${configuration.assigned_order}`;
  $("questionNumber").textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  $("questionText").textContent = q.q;
  $("progress").style.width = `${(currentIndex / questions.length) * 100}%`;

  const box = $("answers");
  box.replaceChildren();

  q.a.forEach((answer, index) => {
    const btn = document.createElement("button");
    btn.className = "answer-btn";

    const letter = document.createElement("span");
    letter.className = "answer-letter";
    letter.textContent = `${LETTERS[index]}.`;

    const text = document.createElement("span");
    text.textContent = answer;

    btn.append(letter, text);
    btn.addEventListener("click", () => recordAnswer(answer));
    box.appendChild(btn);
  });
}

function recordAnswer(selectedAnswer) {
  const q = questions[currentIndex];
  const timeMs = Date.now() - questionStartAt;

  let outcome;
  if (selectedAnswer === IDK_TEXT) outcome = "idk";
  else if (selectedAnswer === q.k) outcome = "correct";
  else outcome = "incorrect";

  questionRecords.push({
    index: questionRecords.length + 1,
    question_id: q.id,
    question_text: q.q,
    lecture: configuration.lecture,
    source_test: configuration.test,
    source_variant: q.source_variant || null,
    selected_answer: selectedAnswer,
    correct_answer: q.k,
    outcome,
    time_ms: timeMs
  });

  outcomes.push(outcome);
  currentIndex++;

  if (currentIndex < questions.length) {
    renderQuestion();
  } else {
    finishTest();
  }
}

function finishTest() {
  testInProgress = false;
  document.body.classList.remove("testing");
  $("progress").style.width = "100%";
  $("testCard").classList.add("hidden");
  $("completeCard").classList.remove("hidden");
}

// 1 = correct, -1 = incorrect, 0 = "I don't know"
function outcomesToCodes() {
  return outcomes.map((o) => (o === "correct" ? 1 : o === "incorrect" ? -1 : 0));
}

// ---- encryption ----
// Hybrid scheme: a fresh AES-256-GCM key encrypts the result JSON; that AES
// key is then wrapped with the RSA-OAEP public key above. Only the holder of
// the private key can unwrap it. See tools/decrypt.py for the other side.
function b64(bytes) {
  let s = "";
  const arr = new Uint8Array(bytes);
  for (let i = 0; i < arr.length; i++) s += String.fromCharCode(arr[i]);
  return btoa(s);
}

function base64ToBytes(str) {
  const bin = atob(str);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

let publicKeyPromise = null;
function getPublicKey() {
  if (!PUBLIC_KEY_SPKI_B64) {
    return Promise.reject(new Error("No PUBLIC_KEY_SPKI_B64 configured in this file."));
  }
  if (!publicKeyPromise) {
    publicKeyPromise = crypto.subtle.importKey(
      "spki",
      base64ToBytes(PUBLIC_KEY_SPKI_B64),
      { name: "RSA-OAEP", hash: "SHA-256" },
      false,
      ["encrypt"]
    );
  }
  return publicKeyPromise;
}

async function encryptResult(resultObj, meta) {
  const plaintext = new TextEncoder().encode(JSON.stringify(resultObj));

  const aesKey = await crypto.subtle.generateKey(
    { name: "AES-GCM", length: 256 },
    true,
    ["encrypt"]
  );
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aesKey, plaintext);

  const rawAesKey = await crypto.subtle.exportKey("raw", aesKey);
  const wrappedKey = await crypto.subtle.encrypt(
    { name: "RSA-OAEP" },
    await getPublicKey(),
    rawAesKey
  );

  return {
    format: "quiz-result-encrypted",
    v: 1,
    alg: "RSA-OAEP-SHA256 + AES-256-GCM",
    // Cleartext so you can track completion in the sheet without decrypting.
    // Delete these lines (here and in Code.gs) if even that is too much.
    meta: {
      participant_id: meta.participant_id,
      lecture: meta.lecture,
      test: meta.test,
      assigned_order: meta.assigned_order,
      finished_at: meta.finished_at
    },
    ek: b64(wrappedKey),
    iv: b64(iv),
    ct: b64(ciphertext)
  };
}

async function uploadResult(payload) {
  if (!COLLECT_URL) throw new Error("upload disabled (no COLLECT_URL)");
  const body = COLLECT_TOKEN ? { ...payload, token: COLLECT_TOKEN } : payload;
  const res = await fetch(COLLECT_URL, {
    method: "POST",
    // text/plain keeps this a "simple" CORS request (no preflight); the
    // Apps Script redirect target still returns Access-Control-Allow-Origin.
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body),
    redirect: "follow"
  });
  if (!res.ok) throw new Error(`server returned HTTP ${res.status}`);
  const out = await res.json().catch(() => ({}));
  if (out && out.ok === false) throw new Error(out.error || "server rejected the submission");
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function resetEndButton() {
  const btn = $("endTestBtn");
  btn.disabled = false;
  btn.textContent = "End Quiz";
  $("completeError").textContent = "";
}

async function endTest() {
  const btn = $("endTestBtn");
  btn.disabled = true;
  btn.textContent = "Submitting…";
  $("completeError").textContent = "";

  const finishedAt = new Date().toISOString();
  const meta = {
    lecture: configuration.lecture,
    test: configuration.test,
    assigned_order: configuration.assigned_order,
    selection_mode: configuration.selection_mode,
    participant_id: configuration.participant_id,
    source_file: configuration.source_file,
    n_questions: questions.length,
    started_at: startedAt,
    finished_at: finishedAt,
    duration_ms: Date.parse(finishedAt) - Date.parse(startedAt)
  };

  const stamp = finishedAt.replace(/[:.]/g, "-");
  const safeId = meta.participant_id.replace(/[^A-Za-z0-9_-]/g, "_");
  const baseName = `quiz_${meta.lecture}_${meta.test}_${safeId}_${stamp}`;

  let payload;
  try {
    const fileObj = buildResultFile(meta, questionRecords);
    payload = await encryptResult(fileObj, meta);
  } catch (err) {
    // Encryption itself failed — nothing safe to send. Surface it and let
    // them retry rather than silently leaking a plaintext file.
    $("completeError").textContent =
      `Could not encrypt the results: ${err.message}\n` +
      `Please tell the researcher — do not close this tab yet.`;
    btn.disabled = false;
    btn.textContent = "Try again";
    return;
  }

  const saveEncryptedFile = () =>
    downloadBlob(
      new Blob([JSON.stringify(payload)], { type: "application/json" }),
      `${baseName}.enc.json`
    );

  if (!COLLECT_URL) {
    // No endpoint configured: encrypted-file mode.
    saveEncryptedFile();
    btn.textContent = "Saved ✓";
    $("completeText").textContent =
      `An encrypted results file "${baseName}.enc.json" has been saved. ` +
      `Please send it to the researcher.`;
    return;
  }

  try {
    await uploadResult(payload);
    btn.textContent = "Submitted ✓";
    $("completeText").textContent =
      "Your responses have been submitted. Thank you — you can close this tab.";
  } catch (err) {
    // Upload failed (offline, endpoint down). Don't lose the data: hand over
    // the encrypted file so it can be emailed to the researcher.
    saveEncryptedFile();
    btn.textContent = "Saved to this device";
    $("completeError").textContent =
      `Could not reach the server (${err.message}).\n` +
      `An encrypted file "${baseName}.enc.json" has been downloaded instead — ` +
      `please email it to the researcher. It contains no readable data.`;
  }
}

function restart() {
  questions = [];
  outcomes = [];
  questionRecords = [];
  questionStartAt = null;
  currentIndex = 0;
  configuration = null;
  testInProgress = false;

  document.body.classList.remove("testing");
  $("completeCard").classList.add("hidden");
  $("testCard").classList.add("hidden");
  $("setupCard").classList.remove("hidden");
  $("completeText").textContent = "Your responses have been recorded.";
  resetEndButton();
}

// ---- init ----
if (!(window.crypto && crypto.getRandomValues && crypto.subtle)) {
  $("setupError").textContent =
    "This browser has no Web Crypto API (or the page is not served over HTTPS). " +
    "Use a current Chrome, Edge, Firefox or Safari over https:// or http://localhost.";
  $("startBtn").disabled = true;
}

window.addEventListener("beforeunload", (event) => {
  if (testInProgress) {
    event.preventDefault();
    event.returnValue = "";
  }
});

$("startBtn").addEventListener("click", loadTest);
$("endTestBtn").addEventListener("click", endTest);
$("restartBtn").addEventListener("click", restart);

loadConfig();
</script>
</body>
</html>
